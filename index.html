<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0b0f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><title>StreamMatch</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b0b0f;color:#fff;--p:#ff477e;--panel:#17171f;--muted:#9b9baa}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0,#29152e,transparent 28%),#0b0b0f}.app{max-width:820px;margin:auto;padding:env(safe-area-inset-top) 16px 92px}.top{display:flex;justify-content:space-between;align-items:center;padding:18px 0 8px}.top h1{font-size:26px;margin:2px 0}.eyebrow{font-size:11px;letter-spacing:.14em;color:var(--muted)}.avatar{width:42px;height:42px;border-radius:50%;background:#24242e;display:grid;place-items:center;font-weight:850}.hero{padding:21px;border:1px solid #3c2842;border-radius:24px;background:linear-gradient(135deg,#2c1830,#15151c 60%,#10242b);margin:8px 0 18px}.hero h2{font-size:32px;line-height:1.04;margin:5px 0 9px}.muted,.hero p{color:var(--muted)}button,input,select{font:inherit}button{color:#fff;border:0}.primary{background:var(--p);padding:11px 15px;border-radius:12px;font-weight:800}.secondary{background:#292934;padding:10px 13px;border-radius:11px}.chips,.seg{display:flex;gap:8px;overflow:auto;padding:4px 0 13px;scrollbar-width:none}.chip,.seg button{background:#1e1e28;padding:9px 12px;border-radius:999px;white-space:nowrap}.chip.on,.seg button.on{background:#fff;color:#111;font-weight:750}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{min-width:0}.poster{aspect-ratio:2/3;border-radius:16px;background:#20202a center/cover no-repeat;position:relative;overflow:hidden;border:1px solid #30303b;cursor:pointer}.shade{position:absolute;inset:50% 0 0;background:linear-gradient(transparent,#000b)}.heart{position:absolute;right:9px;top:9px;width:39px;height:39px;border-radius:50%;background:#09090bd9;font-size:21px;z-index:3}.heart.on{color:#ff5a8b}.badge{position:absolute;left:8px;bottom:8px;font-size:10px;padding:4px 6px;border-radius:7px;background:#08080bd9;z-index:2}.card h3{font-size:14px;margin:7px 2px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:12px;color:var(--muted)}h2.section{font-size:20px;margin:23px 0 11px}.bottom{position:fixed;left:0;right:0;bottom:0;background:#111117ef;border-top:1px solid #292934;display:flex;justify-content:space-around;padding:8px 6px max(8px,env(safe-area-inset-bottom));backdrop-filter:blur(14px);z-index:20}.nav{background:none;color:#858592;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px}.nav span{font-size:21px}.nav.on{color:#fff}.empty,.notice{padding:18px 14px;border-radius:16px;color:var(--muted)}.empty{border:1px dashed #34343e;text-align:center}.notice{background:#211725;border:1px solid #46344a;color:#e9dceb;margin:14px 0}.box{background:var(--panel);border-radius:18px;padding:16px;margin:12px 0}.field{width:100%;background:#0f0f15;color:#fff;border:1px solid #343440;border-radius:12px;padding:12px;margin:6px 0 10px}.row{display:flex;gap:8px;align-items:center}.row>*{min-width:0}.search{display:flex;gap:8px;margin:8px 0 15px}.search input{flex:1}.matchtoast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#fff;color:#111;padding:12px 16px;border-radius:999px;font-weight:900;z-index:99}.loader{padding:36px;text-align:center;color:var(--muted)}.modal{position:fixed;inset:0;background:#09090df5;z-index:60;overflow:auto;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}.detailHero{height:46vh;min-height:330px;background:#222 center/cover;position:relative}.detailHero:after{content:"";position:absolute;inset:35% 0 0;background:linear-gradient(transparent,#09090d)}.detail{position:relative;margin-top:-80px;padding:0 18px 38px;z-index:2;max-width:760px;margin-left:auto;margin-right:auto}.close{position:fixed;top:max(18px,env(safe-area-inset-top));left:16px;width:42px;height:42px;border-radius:50%;background:#111c;z-index:70;font-size:24px}.provider{display:inline-flex;align-items:center;gap:6px;background:#24242d;border-radius:10px;padding:7px 9px;margin:4px}.provider img{width:25px;height:25px;border-radius:6px}.setup h2{margin-bottom:4px}.tiny{font-size:11px;color:var(--muted)}@media(min-width:650px){.grid{grid-template-columns:repeat(4,1fr)}} </style></head><body><div id="app"></div><div id="overlay"></div><script>
const $=s=>document.querySelector(s),IMG='https://image.tmdb.org/t/p/w500',BACK='https://image.tmdb.org/t/p/w1280';let cfg=JSON.parse(localStorage.smCfg||'{}');let user=localStorage.smUser||'Christian',favs=JSON.parse(localStorage.smFavs||'{"Christian":[],"Izabelle":[]}'),view='home',sort='popular',kind='all',providers=[],selected=new Set(JSON.parse(localStorage.smServices||'["Netflix","Max"]')),items=[],busy=false,sb=null,session=null;const wanted=['Netflix','Max','Disney Plus','Amazon Prime Video','SkyShowtime','Apple TV Plus','Viaplay','TV 2 Play','TV4 Play'];
function save(){localStorage.smUser=user;localStorage.smFavs=JSON.stringify(favs);localStorage.smCfg=JSON.stringify(cfg);localStorage.smServices=JSON.stringify([...selected])}function key(m){return (m.media_type||m.type)+':'+m.id}function partner(){return user==='Christian'?'Izabelle':'Christian'}function mine(m){return favs[user].includes(key(m))}function ismatch(m){let k=key(m);return favs.Christian.includes(k)&&favs.Izabelle.includes(k)}function title(m){return m.title||m.name||'Okänd titel'}function date(m){return m.release_date||m.first_air_date||''}function typeSv(m){return (m.media_type||m.type)==='tv'?'Serie':'Film'}
async function api(path,params={}){if(!cfg.tmdb)throw new Error('TMDB saknas');let u=new URL('https://api.themoviedb.org/3'+path);Object.entries(params).forEach(([k,v])=>v!==undefined&&v!==''&&u.searchParams.set(k,v));let r=await fetch(u,{headers:{Authorization:'Bearer '+cfg.tmdb,accept:'application/json'}});if(!r.ok)throw new Error('TMDB '+r.status);return r.json()}
async function init(){if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});if(cfg.supabaseUrl&&cfg.supabaseKey&&window.supabase){sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseKey);let x=await sb.auth.getSession();session=x.data.session;if(session)await pullCloud()}if(cfg.tmdb){try{await loadProviders();await loadContent()}catch(e){console.error(e)}}render()}
async function loadProviders(){let [m,t]=await Promise.all([api('/watch/providers/movie',{watch_region:'SE',language:'sv-SE'}),api('/watch/providers/tv',{watch_region:'SE',language:'sv-SE'})]);let map=new Map([...m.results,...t.results].map(p=>[p.provider_id,p]));providers=[...map.values()].filter(p=>wanted.some(w=>p.provider_name.toLowerCase().includes(w.toLowerCase())||w.toLowerCase().includes(p.provider_name.toLowerCase()))).sort((a,b)=>(a.display_priority||99)-(b.display_priority||99));}
function providerIds(){let ids=providers.filter(p=>selected.has(labelProvider(p.provider_name))).map(p=>p.provider_id);return ids.join('|')}function labelProvider(n){if(n.includes('Disney'))return'Disney+';if(n.includes('Amazon'))return'Prime Video';if(n.includes('Apple'))return'Apple TV+';if(n.includes('Plus')&&n.includes('HBO'))return'Max';return n}
async function loadContent(){busy=true;render();let ids=providerIds(),common={language:'sv-SE',watch_region:'SE',with_watch_monetization_types:'flatrate',with_watch_providers:ids,page:1};let movie={...common,region:'SE'},tv={...common};if(sort==='popular'){movie.sort_by='popularity.desc';tv.sort_by='popularity.desc'}if(sort==='rating'){movie.sort_by='vote_average.desc';movie['vote_count.gte']=200;tv.sort_by='vote_average.desc';tv['vote_count.gte']=100}if(sort==='latest'){movie.sort_by='primary_release_date.desc';movie['primary_release_date.lte']=new Date().toISOString().slice(0,10);tv.sort_by='first_air_date.desc';tv['first_air_date.lte']=new Date().toISOString().slice(0,10)}let req=[];if(kind!=='tv')req.push(api('/discover/movie',movie).then(d=>d.results.map(x=>({...x,media_type:'movie'}))));if(kind!=='movie')req.push(api('/discover/tv',tv).then(d=>d.results.map(x=>({...x,media_type:'tv'}))));items=(await Promise.all(req)).flat().sort((a,b)=>sort==='rating'?b.vote_average-a.vote_average:sort==='latest'?date(b).localeCompare(date(a)):b.popularity-a.popularity);busy=false;render()}
async function doSearch(){let q=$('#q')?.value.trim();if(!q)return;busy=true;render();let [m,t]=await Promise.all([api('/search/movie',{query:q,language:'sv-SE',region:'SE'}),api('/search/tv',{query:q,language:'sv-SE'})]);items=[...m.results.map(x=>({...x,media_type:'movie'})),...t.results.map(x=>({...x,media_type:'tv'}))].sort((a,b)=>b.popularity-a.popularity);view='search';busy=false;render()}
async function toggle(m){let k=key(m),a=favs[user],had=a.includes(k);favs[user]=had?a.filter(x=>x!==k):[...a,k];save();if(sb&&session)await syncFav(k,!had,m);if(!had&&ismatch(m)){let d=document.createElement('div');d.className='matchtoast';d.textContent='💞 Ni vill båda se den här!';document.body.append(d);setTimeout(()=>d.remove(),1800)}render()}
async function syncFav(k,on,m){try{let row={user_id:session.user.id,profile_name:user,content_key:k,title:title(m),poster_path:m.poster_path||null,media_type:m.media_type||m.type};if(on)await sb.from('favorites').upsert(row,{onConflict:'user_id,profile_name,content_key'});else await sb.from('favorites').delete().eq('user_id',session.user.id).eq('profile_name',user).eq('content_key',k)}catch(e){console.error(e)}}async function pullCloud(){try{let {data}=await sb.from('favorites').select('*').eq('user_id',session.user.id);if(data){for(let n of ['Christian','Izabelle'])favs[n]=data.filter(x=>x.profile_name===n).map(x=>x.content_key);save()}}catch(e){console.error(e)}}
function cards(list){if(!list.length)return'<div class="empty">Inget att visa ännu.</div>';return'<div class="grid">'+list.map(m=>'<div class="card"><div class="poster" style="background-image:url(\''+(m.poster_path?IMG+m.poster_path:'')+'\')" onclick="openDetail(\''+(m.media_type||m.type)+'\','+m.id+')"><div class="shade"></div><button class="heart '+(mine(m)?'on':'')+'" onclick="event.stopPropagation();toggleByKey(\''+key(m)+'\')">'+(mine(m)?'♥':'♡')+'</button><span class="badge">'+typeSv(m)+'</span></div><h3>'+esc(title(m))+'</h3><div class="meta">'+(date(m).slice(0,4)||'–')+' · ⭐ '+((m.vote_average||0).toFixed(1))+'</div></div>').join('')+'</div>'}function toggleByKey(k){let m=items.find(x=>key(x)===k);if(m)toggle(m)}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function serviceChips(){let names=[...new Set(providers.map(p=>labelProvider(p.provider_name)))];if(!names.length)names=['Netflix','Max','Disney+','Prime Video','SkyShowtime','Apple TV+','Viaplay','TV4 Play'];return'<div class="chips">'+names.map(s=>'<button class="chip '+(selected.has(s)?'on':'')+'" onclick="toggleService(\''+esc(s)+'\')">'+esc(s)+'</button>').join('')+'</div>'}function toggleService(s){selected.has(s)?selected.delete(s):selected.add(s);save();if(cfg.tmdb)loadContent();else render()}
function nav(){return'<div class="bottom">'+[['home','⌂','Hem'],['search','⌕','Sök'],['matches','♡','Matches'],['favorites','♥','Favoriter'],['profile','◉','Profil']].map(n=>'<button class="nav '+(view===n[0]?'on':'')+'" onclick="view=\''+n[0]+'\';render()"><span>'+n[1]+'</span>'+n[2]+'</button>').join('')+'</div>'}
function setup(){return'<div class="top"><div><div class="eyebrow">STREAMMATCH</div><h1>Koppla riktig data</h1></div></div><div class="box setup"><h2>TMDB</h2><p class="muted">Klistra in din TMDB API Read Access Token. Därefter hämtas riktiga titlar, posters och svenska streamingfilter.</p><input class="field" id="tmdb" type="password" placeholder="TMDB Read Access Token" value="'+esc(cfg.tmdb||'')+'"><button class="primary" onclick="saveTmdb()">Spara och starta</button></div><div class="box setup"><h2>Supabase <span class="tiny">valfritt tills ni vill synka två telefoner</span></h2><input class="field" id="surl" placeholder="Project URL" value="'+esc(cfg.supabaseUrl||'')+'"><input class="field" id="skey" type="password" placeholder="Publishable / anon key" value="'+esc(cfg.supabaseKey||'')+'"><button class="secondary" onclick="saveSupabase()">Spara Supabase</button></div><div class="notice">Appen fungerar fortfarande i lokalt läge utan Supabase. TMDB-token krävs för den riktiga katalogen.</div>'}
async function saveTmdb(){cfg.tmdb=$('#tmdb').value.trim();save();await loadProviders();await loadContent()}async function saveSupabase(){cfg.supabaseUrl=$('#surl').value.trim();cfg.supabaseKey=$('#skey').value.trim();save();location.reload()}
function home(){if(!cfg.tmdb)return setup();return'<div class="top"><div><div class="eyebrow">STREAMMATCH</div><h1>Vad ska vi se ikväll?</h1></div><div class="avatar">'+user[0]+'</div></div><div class="hero"><div class="eyebrow">FÖR ER TVÅ</div><h2>Sluta scrolla.<br>Hitta er match.</h2><p>Filmer och serier på era svenska streamingtjänster.</p><button class="primary" onclick="pick()">Vad ska vi se?</button></div>'+serviceChips()+'<div class="seg"><button class="'+(sort==='popular'?'on':'')+'" onclick="setSort(\'popular\')">Populärt</button><button class="'+(sort==='latest'?'on':'')+'" onclick="setSort(\'latest\')">Nyast</button><button class="'+(sort==='rating'?'on':'')+'" onclick="setSort(\'rating\')">Bäst betyg</button></div><div class="seg"><button class="'+(kind==='all'?'on':'')+'" onclick="setKind(\'all\')">Allt</button><button class="'+(kind==='movie'?'on':'')+'" onclick="setKind(\'movie\')">Filmer</button><button class="'+(kind==='tv'?'on':'')+'" onclick="setKind(\'tv\')">Serier</button></div><h2 class="section">'+(sort==='popular'?'🔥 Populärt just nu':sort==='latest'?'🆕 Nytt':'⭐ Bäst betyg')+'</h2>'+(busy?'<div class="loader">Hämtar…</div>':cards(items))+'<p class="tiny">Streaminginformation från TMDB/JustWatch. Region: Sverige.</p>'}function setSort(x){sort=x;loadContent()}function setKind(x){kind=x;loadContent()}
function searchView(){return'<div class="top"><div><div class="eyebrow">HITTA NÅGOT</div><h1>Sök</h1></div></div><div class="search"><input class="field" id="q" placeholder="Film eller serie…" onkeydown="if(event.key===\'Enter\')doSearch()"><button class="primary" onclick="doSearch()">Sök</button></div>'+(view==='search'?(busy?'<div class="loader">Söker…</div>':cards(items)):'<div class="empty">Sök i TMDB:s film- och seriekatalog.</div>')}
function favView(matchOnly){let ks=matchOnly?favs.Christian.filter(k=>favs.Izabelle.includes(k)):favs[user];let list=items.filter(m=>ks.includes(key(m)));return'<div class="top"><div><div class="eyebrow">'+(matchOnly?'ER GEMENSAMMA LISTA':'DIN LISTA')+'</div><h1>'+(matchOnly?'Matches 💞':'Favoriter')+'</h1></div></div>'+cards(list)+(ks.length&&!list.length?'<div class="notice">Några sparade titlar finns inte i den nuvarande listvyn. Sök efter dem för att visa dem igen.</div>':'')}
function profile(){return'<div class="top"><div><div class="eyebrow">INSTÄLLNINGAR</div><h1>Profil</h1></div></div><div class="box"><h2>Aktiv profil</h2><div class="row"><button class="primary" onclick="user=\'Christian\';save();render()">Christian</button><button class="primary" onclick="user=\'Izabelle\';save();render()">Izabelle</button></div><p class="muted">Nu: '+user+'</p></div><div class="box"><h2>Datakällor</h2><p class="muted">TMDB: '+(cfg.tmdb?'✅ ansluten':'❌ saknas')+'<br>Supabase: '+(cfg.supabaseUrl&&cfg.supabaseKey?'✅ konfigurerad':'lokal lagring')+'</p><button class="secondary" onclick="cfg.tmdb=\'\';save();render()">Ändra kopplingar</button></div>'+(sb&&!session?'<div class="box"><h2>Molnsynkning</h2><input class="field" id="email" type="email" placeholder="Din e-post"><button class="primary" onclick="magic()">Skicka inloggningslänk</button></div>':'')+(session?'<div class="notice">Molnsynkning aktiv för '+esc(session.user.email||'kontot')+'.</div>':'')}
async function magic(){let email=$('#email').value.trim();if(!email)return;let {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.href.split('?')[0]}});alert(error?error.message:'Kolla din e-post efter inloggningslänken.')}
async function openDetail(type,id){try{let [d,p]=await Promise.all([api('/'+type+'/'+id,{language:'sv-SE',append_to_response:'videos,credits'}),api('/'+type+'/'+id+'/watch/providers')]);let se=p.results?.SE||{};let fl=se.flatrate||[];let trailer=d.videos?.results?.find(v=>v.site==='YouTube'&&v.type==='Trailer');$('#overlay').innerHTML='<div class="modal"><button class="close" onclick="closeDetail()">×</button><div class="detailHero" style="background-image:url(\''+(d.backdrop_path?BACK+d.backdrop_path:d.poster_path?IMG+d.poster_path:'')+'\')"></div><div class="detail"><div class="eyebrow">'+(type==='tv'?'SERIE':'FILM')+'</div><h1>'+esc(d.title||d.name)+'</h1><div class="meta">'+((d.release_date||d.first_air_date||'').slice(0,4))+' · ⭐ '+((d.vote_average||0).toFixed(1))+(d.runtime?' · '+d.runtime+' min':'')+(d.number_of_seasons?' · '+d.number_of_seasons+' säsonger':'')+'</div><p>'+esc(d.overview||'Ingen svensk beskrivning tillgänglig.')+'</p><h3>Finns på i Sverige</h3><div>'+(fl.length?fl.map(x=>'<span class="provider"><img src="'+IMG+x.logo_path+'">'+esc(labelProvider(x.provider_name))+'</span>').join(''):'<span class="muted">Ingen abonnemangs-streaming hittad.</span>')+'</div>'+(trailer?'<p><button class="primary" onclick="window.open(\'https://www.youtube.com/watch?v='+trailer.key+'\',\'_blank\')">▶ Trailer</button></p>':'')+'<p class="tiny">Leverantörsdata via JustWatch/TMDB.</p></div></div>'}catch(e){alert('Kunde inte hämta detaljer.')}}function closeDetail(){$('#overlay').innerHTML=''}
function pick(){let mm=items.filter(ismatch),pool=mm.length?mm:items;if(!pool.length)return;let m=pool[Math.floor(Math.random()*pool.length)];openDetail(m.media_type,m.id)}
function render(){let html='';if(view==='home')html=home();if(view==='search')html=searchView();if(view==='matches')html=favView(true);if(view==='favorites')html=favView(false);if(view==='profile')html=profile();$('#app').innerHTML='<main class="app">'+html+'</main>'+nav()}init();
</script></body></html>
