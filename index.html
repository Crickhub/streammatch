<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0b0f"><meta name="apple-mobile-web-app-capable" content="yes"><title>StreamMatch</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b0b0f;color:#fff;--p:#ff4f82;--panel:#17171f;--muted:#9a9aaa}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#2b172f,transparent 30%),#0b0b0f}.app{max-width:760px;margin:auto;padding:env(safe-area-inset-top) 16px 88px}.top{display:flex;justify-content:space-between;align-items:center;padding:18px 0 8px}.top h1{font-size:25px;margin:2px 0}.eyebrow{font-size:11px;letter-spacing:.12em;color:var(--muted)}.avatar{width:40px;height:40px;border-radius:50%;background:#22222d;display:grid;place-items:center;font-weight:800}.hero{padding:20px;border:1px solid #38263d;border-radius:24px;background:linear-gradient(135deg,#2b182f,#15151c 60%,#11252b);margin:8px 0 20px}.hero h2{font-size:31px;line-height:1.04;margin:4px 0 9px}.hero p,.muted{color:var(--muted)}button{font:inherit;color:#fff;border:0}.primary{background:var(--p);padding:11px 15px;border-radius:12px;font-weight:800}.chips,.seg{display:flex;gap:8px;overflow:auto;padding:4px 0 14px}.chip,.seg button{background:#1e1e28;padding:9px 12px;border-radius:999px;white-space:nowrap}.chip.on,.seg button.on{background:#fff;color:#111;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{min-width:0}.poster{aspect-ratio:2/3;border-radius:16px;background:linear-gradient(145deg,#3c2444,#16242c);position:relative;overflow:hidden;border:1px solid #30303b;padding:14px;display:flex;align-items:flex-end}.poster b{font-size:22px;line-height:1.05}.heart{position:absolute;right:9px;top:9px;width:39px;height:39px;border-radius:50%;background:#09090bbb;font-size:20px}.heart.on{color:#ff5a8b}.badges{position:absolute;left:8px;bottom:8px;right:8px;display:flex;gap:4px;flex-wrap:wrap}.badge{font-size:10px;padding:4px 6px;border-radius:7px;background:#08080bd9}.card h3{font-size:14px;margin:7px 2px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:12px;color:var(--muted)}h2.section{font-size:20px;margin:24px 0 11px}.bottom{position:fixed;left:0;right:0;bottom:0;background:#111117f2;border-top:1px solid #292934;display:flex;justify-content:space-around;padding:8px 6px max(8px,env(safe-area-inset-bottom));backdrop-filter:blur(14px)}.nav{background:none;color:#858592;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px}.nav span{font-size:21px}.nav.on{color:#fff}.empty{padding:30px 14px;border:1px dashed #30303b;border-radius:16px;color:var(--muted);text-align:center}.notice{padding:12px;border-radius:12px;background:#211725;border:1px solid #46344a;color:#e9dceb;margin:18px 0}.profilebox{background:var(--panel);border-radius:18px;padding:16px;margin:12px 0}.profilebox button{margin-right:8px}.match{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#fff;color:#111;padding:12px 16px;border-radius:999px;font-weight:900;z-index:99}@media(min-width:650px){.grid{grid-template-columns:repeat(4,1fr)}}</style></head><body><div id="app"></div><script>const movies=[['The Night Protocol','Serie','Netflix',8.2],['After the Signal','Film','Max',7.8],['Northbound','Serie','Disney+',8.5],['The Last Table','Film','Prime Video',7.4],['Black Harbour','Serie','SkyShowtime',8.0],['Second Orbit','Film','Apple TV+',8.1],['Cold Case 47','Serie','Viaplay',7.9],['Weekend Escape','Film','TV4 Play',6.9]].map((x,i)=>({id:i+1,title:x[0],type:x[1],service:x[2],rating:x[3]}));let user=localStorage.smUser||'Christian',favs=JSON.parse(localStorage.smFavs||'{"Christian":[],"Izabelle":[]}'),view='home',services=new Set(['Netflix','Max']);function save(){localStorage.smUser=user;localStorage.smFavs=JSON.stringify(favs)}function mine(m){return favs[user].includes(m.id)}function partner(){return user==='Christian'?'Izabelle':'Christian'}function match(m){return favs.Christian.includes(m.id)&&favs.Izabelle.includes(m.id)}function toggle(id){const a=favs[user],had=a.includes(id);favs[user]=had?a.filter(x=>x!==id):[...a,id];save();if(!had&&match(movies.find(m=>m.id===id))){const d=document.createElement('div');d.className='match';d.textContent='💞 Ni vill båda se den här!';document.body.append(d);setTimeout(()=>d.remove(),1800)}render()}function cards(list){return list.length?'<div class="grid">'+list.map(m=>'<div class="card"><div class="poster"><button class="heart '+(mine(m)?'on':'')+'" onclick="toggle('+m.id+')">'+(mine(m)?'♥':'♡')+'</button><b>'+m.title+'</b><div class="badges"><span class="badge">'+m.service+'</span></div></div><h3>'+m.title+'</h3><div class="meta">'+m.type+' · ⭐ '+m.rating+'</div></div>').join('')+'</div>':'<div class="empty">Inget att visa ännu.</div>'}function nav(){return '<div class="bottom">'+[['home','⌂','Hem'],['matches','♡','Matches'],['favorites','♥','Favoriter'],['profile','◉','Profil']].map(n=>'<button class="nav '+(view===n[0]?'on':'')+'" onclick="view=\''+n[0]+'\';render()"><span>'+n[1]+'</span>'+n[2]+'</button>').join('')+'</div>'}function serviceChips(){let all=['Netflix','Max','Disney+','Prime Video','SkyShowtime','Apple TV+','Viaplay','TV4 Play'];return '<div class="chips">'+all.map(s=>'<button class="chip '+(services.has(s)?'on':'')+'" onclick="services.has(\''+s+'\')?services.delete(\''+s+'\'):services.add(\''+s+'\');render()">'+s+'</button>').join('')+'</div>'}function home(){let list=movies.filter(m=>services.has(m.service));let p=movies.filter(m=>favs[partner()].includes(m.id));let mm=movies.filter(match);return '<div class="top"><div><div class="eyebrow">STREAMMATCH</div><h1>Vad ska vi se ikväll?</h1></div><div class="avatar">'+user[0]+'</div></div><div class="hero"><div class="eyebrow">FÖR ER TVÅ</div><h2>Sluta scrolla.<br>Hitta er match.</h2><p>Hjärta det du vill se. När din partner väljer samma titel blir det en match.</p><button class="primary" onclick="pick()">Vad ska vi se?</button></div>'+serviceChips()+'<h2 class="section">🔥 Populärt & aktuellt</h2>'+cards(list)+(p.length?'<h2 class="section">❤️ '+partner()+' vill se</h2>'+cards(p):'')+(mm.length?'<h2 class="section">💞 Era matches</h2>'+cards(mm):'')+'<div class="notice">Demo-version. Innehållet är exempeldata tills TMDB och gemensam databas kopplas in.</div>'}function pick(){let mm=movies.filter(match),pool=mm.length?mm:movies.filter(m=>services.has(m.service));if(!pool.length)return;let m=pool[Math.floor(Math.random()*pool.length)];alert('Ikväll tittar ni på: '+m.title+' ('+m.service+')')}function render(){let html='';if(view==='home')html=home();if(view==='matches')html='<div class="top"><div><div class="eyebrow">ER GEMENSAMMA LISTA</div><h1>Matches 💞</h1></div></div>'+cards(movies.filter(match));if(view==='favorites')html='<div class="top"><div><div class="eyebrow">DIN LISTA</div><h1>Favoriter</h1></div></div>'+cards(movies.filter(m=>mine(m)));if(view==='profile')html='<div class="top"><div><div class="eyebrow">DEMO-PROFILER</div><h1>Profil</h1></div></div><div class="notice">Hjärtan sparas på den här telefonen i demo-läget.</div><div class="profilebox"><h2>Vem använder appen?</h2><button class="primary" onclick="user=\'Christian\';save();render()">Christian</button><button class="primary" onclick="user=\'Izabelle\';save();render()">Izabelle</button><p class="muted">Aktiv profil: '+user+'</p></div><div class="profilebox"><h2>Nästa steg</h2><p class="muted">Koppla TMDB för riktiga filmer/serier och Supabase för synkning mellan två telefoner.</p></div>';document.getElementById('app').innerHTML='<main class="app">'+html+'</main>'+nav()}render();</script></body></html>
